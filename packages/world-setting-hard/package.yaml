name: "World Setting (HARD)"
slug: world-setting-hard
version: 3.3.9
mo2_mod_name: "World Setting - Hard"

# Shared components/ folders to pull in wholesale (see ../../components/)
# NOTE: as of 3.0.0 this package is narrative-only, full stop -- world_setting_shared
# (the old worn-device physics file) is dropped too. Physics now lives entirely in the
# required BDSMLOCK_and_VIBRATIONS_Fix package (2.0.0+), powered by a third-party addon's
# decorators. gagged_speech is likewise now bundled in that Fix package rather than being
# a separate optional install -- it never lived here, that part is unchanged.
includes:
  - world_setting_hard_narrative

meta_ini:
  comments: "SkyrimNet HARD overlay: world/personality narrative layer only, no physics of its own. Requires BDSMLOCK_and_VIBRATIONS_Fix (2.0.0+) installed alongside it. No ESP."
  notes: "Highest left-pane above SkyrimNet_b24 and above BDSMLOCK_and_VIBRATIONS_Fix (2.0.0+, which also needs the third-party 'DD SkyrimNet AddOn' Base component for physics to render, and now bundles gagged speech). Disable Skyrim selfparody. Formerly named 'NEFARAM World Setting - Hard' -- if upgrading from that folder, remove it first, this is a new MO2 mod name. Restart after install."

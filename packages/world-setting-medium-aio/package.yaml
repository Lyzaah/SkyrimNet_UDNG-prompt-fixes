name: "World Setting - Medium (AIO)"
slug: world-setting-medium-aio
version: 3.2.7
mo2_mod_name: "World Setting - Medium (AIO)"

# Convenience bundle: everything world-setting-medium needs to actually work,
# in one zip. Community-facing install should prefer the separate pieces
# (world-setting-medium + bdsmlock-and-vibrations-fix, which now bundles
# gagged-speech itself) so updates to either are visible and load order
# stays legible. world_setting_shared is gone -- physics now comes from
# vrtedd_worn_truth, part of the Fix package's own scope, mirrored here.
# roleplay_guidelines (2.3.0+) is this AIO-only for now -- not yet added to
# the separate world-setting-medium/hard packages, ask before assuming it
# should be.
includes:
  - bdsmlock_vibrations_fix
  - gagged_speech
  - vrtedd_worn_truth
  - world_setting_medium_narrative
  - roleplay_guidelines

meta_ini:
  comments: "SkyrimNet overlay MEDIUM, all-in-one: BDSMLOCK/vibrator fix + gagged speech + worn-device physics + world/personality narrative, bundled for convenience. No ESP."
  notes: "Left pane, above SkyrimNet_b24. Requires the third-party 'DD SkyrimNet AddOn' (Base component, ESP ticked) for the worn-device physics section to render. Do not also install the separate bdsmlock-and-vibrations-fix/world-setting-medium packages -- same filenames, pick one or the other. Restart after install."
